services:
  - type: web
    name: trading-assistant-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    # Public Git repository flow: connect the Render GitHub App to enable commit deploys.
    autoDeployTrigger: off
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: APP_NAME
        value: Trading Assistant API
      - key: APP_API_VERSION
        value: v1
