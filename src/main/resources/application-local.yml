spring:
  data:
    mongodb:
      # Local development only. Production requires MONGODB_URI and never has a
      # fallback. The database name is fixed to trading_assistant.
      uri: ${MONGODB_URI:mongodb://localhost:27017/trading_assistant}

app:
  security:
    # An ephemeral signing key is generated when JWT_SECRET is absent. Set
    # JWT_SECRET to keep tokens valid across restarts.
    jwt-secret: ${JWT_SECRET:}

logging:
  level:
    com.tradingassistant: DEBUG
    org.springframework.web: INFO
